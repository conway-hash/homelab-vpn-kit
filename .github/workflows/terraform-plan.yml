name: OpenTofu Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: tofu-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.8.*"

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      # Proxmox's API is tailnet-only — the runner has to join before `tofu
      # plan` can refresh/read the reverse proxy server VM's resources. Reads
      # headscale_server_url straight out of the repo this job already
      # checked out — one repo now, so no cross-repo fetch needed for this.
      - name: Read tailnet vars from this repo
        run: |
          {
            echo "HEADSCALE_SERVER_URL=$(grep '^headscale_server_url:' ../ansible/group_vars/all/vars.yml | sed 's/^headscale_server_url:[[:space:]]*//; s/[[:space:]]*#.*$//')"
            echo "TAILNET_BASE_DOMAIN=$(grep '^tailnet_base_domain:' ../ansible/group_vars/all/vars.yml | sed 's/^tailnet_base_domain:[[:space:]]*//; s/[[:space:]]*#.*$//')"
          } >> "$GITHUB_ENV"

      # authkey (not OAuth) is the only option here: OAuth clients are a
      # Tailscale-SaaS concept, this points at our own Headscale instead.
      # Skipped while ENABLE_PROXY is unset — with no Proxmox resources in
      # the plan there's nothing tailnet-only to refresh, and before the
      # first deploy there's no tailnet to join yet either.
      - if: vars.ENABLE_PROXY == 'true'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: --login-server=${{ env.HEADSCALE_SERVER_URL }}
          hostname: ci-tofu-plan

      - name: tofu init
        run: |
          tofu init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=coordination-server"

      - name: tofu fmt (check)
        run: tofu fmt -check -recursive

      - name: tofu validate
        run: tofu validate

      - name: tofu plan
        id: plan
        run: |
          tofu plan -no-color -input=false \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="region=${{ vars.GCP_REGION }}" \
            -var="zone=${{ vars.GCP_ZONE }}" \
            -var="instance_name=${{ vars.INSTANCE_NAME }}" \
            -var="machine_type=${{ vars.MACHINE_TYPE }}" \
            -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
            -var="enable_proxy=${{ vars.ENABLE_PROXY == 'true' }}" \
            -var="tailnet_base_domain=${{ env.TAILNET_BASE_DOMAIN }}" \
            -var="headscale_server_url=${{ env.HEADSCALE_SERVER_URL }}" \
            -var="proxmox_host=${{ vars.PROXMOX_HOST || 'pve' }}" \
            -var="proxmox_api_token=${{ secrets.PROXMOX_API_TOKEN }}" \
            -var="proxmox_node=${{ vars.PROXMOX_NODE || 'pve' }}" \
            -var="proxy_tailscale_authkey=${{ secrets.PROXY_NODE_TS_AUTHKEY }}" \
            -out=tfplan

      - name: tofu show
        id: show
        run: |
          {
            echo "plan<<TFPLAN_EOF"
            tofu show -no-color tfplan
            echo "TFPLAN_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment plan on PR
        uses: actions/github-script@v9
        env:
          PLAN: "${{ steps.show.outputs.plan }}"
        with:
          script: |
            const output = `#### OpenTofu Plan\n<details><summary>Show plan</summary>\n\n\`\`\`\n${process.env.PLAN}\n\`\`\`\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output,
            });
