---
- name: Refuse to run without a Headscale pre-auth key
  ansible.builtin.assert:
    that:
      - tailscale_authkey | length > 0
    fail_msg: >-
      tailscale_authkey must be set — generate one with
      `headscale preauthkeys create` on this coordination server (NOT
      --ephemeral, this node should persist). See SETUP.md.

- name: Add Tailscale apt repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: deb
    uris: https://pkgs.tailscale.com/stable/ubuntu
    suites: "{{ ansible_facts.distribution_release }}"
    components: main
    signed_by: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_facts.distribution_release }}.noarmor.gpg"

- name: Install tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Check current tailscale connection state
  ansible.builtin.command: tailscale status --json
  register: ts_status
  changed_when: false
  failed_when: false

# headscale_server_url comes from group_vars/all/vars.yml, not this role.
- name: Join the tailnet
  ansible.builtin.command: >
    tailscale up
    --login-server={{ headscale_server_url }}
    --authkey={{ tailscale_authkey }}
    --hostname={{ tailnet_hostname }}
  no_log: true # the authkey is a secret — keep it out of CI/job logs
  when: >
    ts_status.rc != 0 or
    (ts_status.stdout | default('{}') | from_json).BackendState | default('') != 'Running'
