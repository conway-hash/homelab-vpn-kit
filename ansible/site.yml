---
- name: Deploy the Headscale coordination server
  hosts: coordination_server
  become: true
  gather_facts: true

  vars:
    swap_size_mb: 2048

  pre_tasks:
    # e2-micro has 1 GB RAM — headroom for docker + headplane during
    # updates/restarts, not a substitute for RAM day-to-day.
    - name: Check for an existing swapfile
      ansible.builtin.stat:
        path: /swapfile
      register: swapfile

    - name: Create swapfile
      ansible.builtin.command: fallocate -l {{ swap_size_mb }}M /swapfile
      when: not swapfile.stat.exists

    - name: Secure swapfile permissions
      ansible.builtin.file:
        path: /swapfile
        mode: "0600"
      when: not swapfile.stat.exists

    - name: Format swapfile
      ansible.builtin.command: mkswap /swapfile
      when: not swapfile.stat.exists

    - name: Enable swapfile
      ansible.builtin.command: swapon /swapfile
      when: not swapfile.stat.exists

    - name: Persist swapfile in fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"
        create: true

    - name: Prefer RAM over swap (swap is a safety net, not primary memory)
      ansible.posix.sysctl:
        name: vm.swappiness
        value: "10"
        state: present
        sysctl_set: true

    # One-time migration: stack_dir moved from /opt/coordination-stack to
    # {{ stack_dir }} when the coordination_stack role was renamed to
    # coordination_server_stack. Without this, the old compose project
    # would keep running untouched and fight the new one for ports 80/443.
    # Headscale's actual state (/etc/headscale, /var/lib/headscale) is a
    # host bind mount OUTSIDE the old stack_dir, so it's untouched by
    # this — only the old compose project itself is torn down. Safe to
    # leave in place after the migration; it's a no-op once the old
    # directory is gone.
    - name: Check for the pre-rename stack directory
      ansible.builtin.stat:
        path: /opt/coordination-stack
      register: old_stack_dir

    - name: Tear down the pre-rename docker compose project, if present
      community.docker.docker_compose_v2:
        project_src: /opt/coordination-stack
        state: absent
      when: old_stack_dir.stat.exists

    - name: Remove the pre-rename stack directory
      ansible.builtin.file:
        path: /opt/coordination-stack
        state: absent
      when: old_stack_dir.stat.exists

  roles:
    - docker
    - coordination_server_stack

- name: Deploy the tailnet's reverse proxy server
  hosts: reverse_proxy_server
  become: true
  gather_facts: true

  roles:
    - docker
    - tailscale
    - reverse_proxy_server_stack
